name: protected staging synthetic acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-synthetic-acceptance
  cancel-in-progress: false

jobs:
  readiness:
    environment: staging-synthetic-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_RUN_MARKER: cdas-staging-${{ github.run_id }}-${{ github.run_attempt }}
      STAGING_DATA_ACK: synthetic-data-only-approved
      STAGING_SYNTHETIC_ONLY_ATTESTED: ${{ vars.STAGING_SYNTHETIC_ONLY_ATTESTED }}
      STAGING_CLERK_INSTANCE_ATTESTED: ${{ vars.STAGING_CLERK_INSTANCE_ATTESTED }}
      STAGING_DATABASE_ISOLATION_ATTESTED: ${{ vars.STAGING_DATABASE_ISOLATION_ATTESTED }}
      STAGING_HOSTING_ACCESS_ATTESTED: ${{ vars.STAGING_HOSTING_ACCESS_ATTESTED }}
      STAGING_ROLLBACK_OWNER_ATTESTED: ${{ vars.STAGING_ROLLBACK_OWNER_ATTESTED }}
      STAGING_RETENTION_ATTESTED: ${{ vars.STAGING_RETENTION_ATTESTED }}
      STAGING_ACCEPTANCE_WRITES_ATTESTED: ${{ vars.STAGING_ACCEPTANCE_WRITES_ATTESTED }}
      STAGING_ACCEPTANCE_CLERK_TOKENS_ATTESTED: ${{ vars.STAGING_ACCEPTANCE_CLERK_TOKENS_ATTESTED }}
      STAGING_ACCEPTANCE_RETENTION_ATTESTED: ${{ vars.STAGING_ACCEPTANCE_RETENTION_ATTESTED }}
      STAGING_ACCEPTANCE_TEST_TEACHER_NAME: CDAS Staging Synthetic Teacher
      STAGING_ACCEPTANCE_TEST_STUDENT_NAME: CDAS Staging Synthetic Student
      STAGING_ACCEPTANCE_TEST_OTHER_STUDENT_NAME: CDAS Staging Synthetic Other Student
      CDAS_DEPLOYMENT_ID: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install exact application dependencies
        run: pnpm install --frozen-lockfile
      - name: Bind source fingerprint to this checkout
        run: echo "CDAS_SOURCE_FINGERPRINT=$(pnpm exec tsx -e \"import { createSourceFingerprint } from './scripts/staging/source-fingerprint.ts'; console.log(createSourceFingerprint())\")" >> "$GITHUB_ENV"
      - name: Validate protected staging configuration
        id: preflight
        continue-on-error: true
        env:
          NODE_ENV: production
          AI_PROVIDER_DISABLED: "1"
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          STAGING_DATABASE_NAME: ${{ vars.STAGING_DATABASE_NAME }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.STAGING_CLERK_SECRET_KEY }}
          STAGING_TEST_TEACHER_CLERK_ID: ${{ secrets.STAGING_TEST_TEACHER_CLERK_ID }}
          STAGING_TEST_STUDENT_CLERK_ID: ${{ secrets.STAGING_TEST_STUDENT_CLERK_ID }}
          STAGING_HEALTH_PROOF_SECRET: ${{ secrets.STAGING_HEALTH_PROOF_SECRET }}
        run: pnpm staging:preflight
      - name: Build production application with the staging Clerk public key
        id: build
        if: ${{ steps.preflight.outcome == 'success' }}
        continue-on-error: true
        env:
          NODE_ENV: production
          AI_PROVIDER_DISABLED: "1"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: pnpm build
      - name: Verify external PostgreSQL metadata in explicit read-only transactions
        id: database
        if: ${{ steps.preflight.outcome == 'success' }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          STAGING_DATABASE_NAME: ${{ vars.STAGING_DATABASE_NAME }}
        run: pnpm staging:verify-database
      - name: Verify Prisma schema drift without deploying migrations
        id: schema-diff
        if: ${{ steps.preflight.outcome == 'success' }}
        continue-on-error: true
        env:
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Verify remote health contract
        id: application
        if: ${{ steps.preflight.outcome == 'success' }}
        continue-on-error: true
        env:
          AI_PROVIDER_DISABLED: "1"
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.STAGING_CLERK_SECRET_KEY }}
          STAGING_HEALTH_PROOF_SECRET: ${{ secrets.STAGING_HEALTH_PROOF_SECRET }}
        run: pnpm staging:verify-application
      - name: Aggregate staging Go/No-Go evidence
        id: aggregate
        if: always()
        env:
          STAGING_BUILD_OUTCOME: ${{ steps.build.outcome }}
          STAGING_SCHEMA_DIFF_OUTCOME: ${{ steps.schema-diff.outcome }}
        run: pnpm staging:aggregate
      - name: Bind same-run Go evidence to synthetic acceptance
        id: acceptance-gate
        if: always()
        continue-on-error: true
        env:
          AI_PROVIDER_DISABLED: "1"
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.STAGING_CLERK_SECRET_KEY }}
          STAGING_TEST_TEACHER_CLERK_ID: ${{ secrets.STAGING_TEST_TEACHER_CLERK_ID }}
          STAGING_TEST_STUDENT_CLERK_ID: ${{ secrets.STAGING_TEST_STUDENT_CLERK_ID }}
          STAGING_TEST_OTHER_STUDENT_CLERK_ID: ${{ secrets.STAGING_TEST_OTHER_STUDENT_CLERK_ID }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          STAGING_DATABASE_NAME: ${{ vars.STAGING_DATABASE_NAME }}
          STAGING_HEALTH_PROOF_SECRET: ${{ secrets.STAGING_HEALTH_PROOF_SECRET }}
        run: pnpm staging:acceptance:gate
      - name: Preserve sanitized staging readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-synthetic-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/staging/
            output/staging-acceptance/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce staging Go/No-Go decision
        if: always()
        run: pnpm staging:assert-decision
      - name: Enforce same-run acceptance gate
        if: always()
        env:
          AI_PROVIDER_DISABLED: "1"
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          STAGING_DATABASE_NAME: ${{ vars.STAGING_DATABASE_NAME }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.STAGING_CLERK_SECRET_KEY }}
          STAGING_TEST_TEACHER_CLERK_ID: ${{ secrets.STAGING_TEST_TEACHER_CLERK_ID }}
          STAGING_TEST_STUDENT_CLERK_ID: ${{ secrets.STAGING_TEST_STUDENT_CLERK_ID }}
          STAGING_TEST_OTHER_STUDENT_CLERK_ID: ${{ secrets.STAGING_TEST_OTHER_STUDENT_CLERK_ID }}
          STAGING_HEALTH_PROOF_SECRET: ${{ secrets.STAGING_HEALTH_PROOF_SECRET }}
        run: pnpm staging:acceptance:assert-gate

  acceptance:
    needs: readiness
    if: ${{ always() }}
    environment: staging-synthetic-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_RUN_MARKER: cdas-staging-${{ github.run_id }}-${{ github.run_attempt }}
      CDAS_DEPLOYMENT_ID: ${{ github.sha }}
      AI_PROVIDER_DISABLED: "1"
      STAGING_ACCEPTANCE_WRITES_ATTESTED: ${{ vars.STAGING_ACCEPTANCE_WRITES_ATTESTED }}
      STAGING_ACCEPTANCE_CLERK_TOKENS_ATTESTED: ${{ vars.STAGING_ACCEPTANCE_CLERK_TOKENS_ATTESTED }}
      STAGING_ACCEPTANCE_RETENTION_ATTESTED: ${{ vars.STAGING_ACCEPTANCE_RETENTION_ATTESTED }}
      STAGING_ACCEPTANCE_TEST_TEACHER_NAME: CDAS Staging Synthetic Teacher
      STAGING_ACCEPTANCE_TEST_STUDENT_NAME: CDAS Staging Synthetic Student
      STAGING_ACCEPTANCE_TEST_OTHER_STUDENT_NAME: CDAS Staging Synthetic Other Student
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install exact application dependencies
        run: pnpm install --frozen-lockfile
      - name: Bind source fingerprint to this checkout
        run: echo "CDAS_SOURCE_FINGERPRINT=$(pnpm exec tsx -e \"import { createSourceFingerprint } from './scripts/staging/source-fingerprint.ts'; console.log(createSourceFingerprint())\")" >> "$GITHUB_ENV"
      - name: Download same-run staging Go evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: staging-synthetic-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: output
      - name: Assert downloaded evidence is same-run and GO before any external write
        id: gate
        continue-on-error: true
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.STAGING_CLERK_SECRET_KEY }}
          STAGING_TEST_TEACHER_CLERK_ID: ${{ secrets.STAGING_TEST_TEACHER_CLERK_ID }}
          STAGING_TEST_STUDENT_CLERK_ID: ${{ secrets.STAGING_TEST_STUDENT_CLERK_ID }}
          STAGING_TEST_OTHER_STUDENT_CLERK_ID: ${{ secrets.STAGING_TEST_OTHER_STUDENT_CLERK_ID }}
          STAGING_DATABASE_NAME: ${{ vars.STAGING_DATABASE_NAME }}
          STAGING_HEALTH_PROOF_SECRET: ${{ secrets.STAGING_HEALTH_PROOF_SECRET }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
        run: pnpm staging:acceptance:assert-gate
      - name: Install Chromium before the immediate pre-write checks
        id: chromium
        if: ${{ steps.gate.outcome == 'success' }}
        run: |
          python3 -m venv .venv-staging-acceptance
          .venv-staging-acceptance/bin/python -m pip install -r scripts/e2e/requirements.txt
          .venv-staging-acceptance/bin/python -m playwright install --with-deps chromium
          echo "$PWD/.venv-staging-acceptance/bin" >> "$GITHUB_PATH"
      - name: Verify all three Clerk identities and ticket capability before database writes
        id: identity
        if: ${{ steps.chromium.outcome == 'success' }}
        continue-on-error: true
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          STAGING_DATABASE_NAME: ${{ vars.STAGING_DATABASE_NAME }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.STAGING_CLERK_SECRET_KEY }}
          STAGING_TEST_TEACHER_CLERK_ID: ${{ secrets.STAGING_TEST_TEACHER_CLERK_ID }}
          STAGING_TEST_STUDENT_CLERK_ID: ${{ secrets.STAGING_TEST_STUDENT_CLERK_ID }}
          STAGING_TEST_OTHER_STUDENT_CLERK_ID: ${{ secrets.STAGING_TEST_OTHER_STUDENT_CLERK_ID }}
          STAGING_HEALTH_PROOF_SECRET: ${{ secrets.STAGING_HEALTH_PROOF_SECRET }}
        run: pnpm staging:acceptance:verify-identities
      - name: Reverify the current remote deployment immediately after identity checks and before writes
        id: immediate-health
        if: ${{ steps.identity.outcome == 'success' }}
        continue-on-error: true
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.STAGING_CLERK_SECRET_KEY }}
          STAGING_HEALTH_PROOF_SECRET: ${{ secrets.STAGING_HEALTH_PROOF_SECRET }}
        run: pnpm staging:verify-application
      - name: Record the final deployment proof before database writes
        id: immediate-evidence
        if: ${{ always() && steps.identity.outcome == 'success' }}
        continue-on-error: true
        env:
          STAGING_IMMEDIATE_HEALTH_OUTCOME: ${{ steps.immediate-health.outcome }}
        run: pnpm staging:acceptance:record-immediate-health
      - name: Append synthetic namespace bootstrap only after all approvals
        id: bootstrap
        if: ${{ steps.immediate-evidence.outcome == 'success' }}
        continue-on-error: true
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.STAGING_CLERK_SECRET_KEY }}
          STAGING_TEST_TEACHER_CLERK_ID: ${{ secrets.STAGING_TEST_TEACHER_CLERK_ID }}
          STAGING_TEST_STUDENT_CLERK_ID: ${{ secrets.STAGING_TEST_STUDENT_CLERK_ID }}
          STAGING_TEST_OTHER_STUDENT_CLERK_ID: ${{ secrets.STAGING_TEST_OTHER_STUDENT_CLERK_ID }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DATABASE_NAME: ${{ vars.STAGING_DATABASE_NAME }}
          STAGING_HEALTH_PROOF_SECRET: ${{ secrets.STAGING_HEALTH_PROOF_SECRET }}
        run: pnpm staging:acceptance:bootstrap
      - name: Run real browser synthetic teacher-two-student manual loop
        id: browser
        if: ${{ steps.bootstrap.outcome == 'success' }}
        continue-on-error: true
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          STAGING_DATABASE_NAME: ${{ vars.STAGING_DATABASE_NAME }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.STAGING_CLERK_SECRET_KEY }}
          STAGING_TEST_TEACHER_CLERK_ID: ${{ secrets.STAGING_TEST_TEACHER_CLERK_ID }}
          STAGING_TEST_STUDENT_CLERK_ID: ${{ secrets.STAGING_TEST_STUDENT_CLERK_ID }}
          STAGING_TEST_OTHER_STUDENT_CLERK_ID: ${{ secrets.STAGING_TEST_OTHER_STUDENT_CLERK_ID }}
          STAGING_HEALTH_PROOF_SECRET: ${{ secrets.STAGING_HEALTH_PROOF_SECRET }}
        run: pnpm staging:acceptance:browser
      - name: Verify only the synthetic namespace in a read-only transaction
        id: verify
        if: ${{ steps.browser.outcome == 'success' }}
        continue-on-error: true
        env:
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          STAGING_DATABASE_NAME: ${{ vars.STAGING_DATABASE_NAME }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.STAGING_CLERK_SECRET_KEY }}
          STAGING_TEST_TEACHER_CLERK_ID: ${{ secrets.STAGING_TEST_TEACHER_CLERK_ID }}
          STAGING_TEST_STUDENT_CLERK_ID: ${{ secrets.STAGING_TEST_STUDENT_CLERK_ID }}
          STAGING_TEST_OTHER_STUDENT_CLERK_ID: ${{ secrets.STAGING_TEST_OTHER_STUDENT_CLERK_ID }}
          STAGING_HEALTH_PROOF_SECRET: ${{ secrets.STAGING_HEALTH_PROOF_SECRET }}
        run: pnpm staging:acceptance:verify
      - name: Aggregate and assert complete synthetic acceptance evidence
        id: final
        if: always()
        continue-on-error: true
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          STAGING_DATABASE_NAME: ${{ vars.STAGING_DATABASE_NAME }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.STAGING_CLERK_SECRET_KEY }}
          STAGING_TEST_TEACHER_CLERK_ID: ${{ secrets.STAGING_TEST_TEACHER_CLERK_ID }}
          STAGING_TEST_STUDENT_CLERK_ID: ${{ secrets.STAGING_TEST_STUDENT_CLERK_ID }}
          STAGING_TEST_OTHER_STUDENT_CLERK_ID: ${{ secrets.STAGING_TEST_OTHER_STUDENT_CLERK_ID }}
          STAGING_HEALTH_PROOF_SECRET: ${{ secrets.STAGING_HEALTH_PROOF_SECRET }}
        run: pnpm staging:acceptance:assert-final
      - name: Preserve redacted synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-synthetic-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/staging-acceptance/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce complete remote synthetic acceptance
        if: always()
        run: |
          test "${{ steps.gate.outcome }}" = success
          test "${{ steps.immediate-health.outcome }}" = success
          test "${{ steps.immediate-evidence.outcome }}" = success
          test "${{ steps.identity.outcome }}" = success
          test "${{ steps.chromium.outcome }}" = success
          test "${{ steps.bootstrap.outcome }}" = success
          test "${{ steps.browser.outcome }}" = success
          test "${{ steps.verify.outcome }}" = success
          test "${{ steps.final.outcome }}" = success
