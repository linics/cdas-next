name: protected real-service e2e

on:
  workflow_dispatch:
    inputs:
      run_real_model:
        description: Run the synthetic-data AI Gateway smoke after the manual loop
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  real-service-gate:
    environment: e2e-real
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5434/cdas_next_e2e
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      DEV_TEST_TEACHER_CLERK_ID: ${{ secrets.DEV_TEST_TEACHER_CLERK_ID }}
      DEV_TEST_STUDENT_CLERK_ID: ${{ secrets.DEV_TEST_STUDENT_CLERK_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact application dependencies
        run: pnpm install --frozen-lockfile

      - name: Install exact browser dependency
        run: |
          python3 -m venv .venv-e2e
          .venv-e2e/bin/python -m pip install -r scripts/e2e/requirements.txt
          .venv-e2e/bin/python -m playwright install --with-deps chromium
          echo "$PWD/.venv-e2e/bin" >> "$GITHUB_PATH"

      - name: Run real Clerk dual-account closed loop with AI disabled
        run: pnpm e2e:closed-loop

      - name: Run real AI Gateway synthetic-data smoke
        if: ${{ inputs.run_real_model }}
        env:
          AI_PROVIDER_DISABLED: "0"
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_TOOL_APPROVAL_SECRET: ${{ secrets.AI_TOOL_APPROVAL_SECRET }}
          E2E_REAL_MODEL_ACK: synthetic-data-cost-approved
        run: pnpm e2e:real-model

      - name: Preserve sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-service-e2e-${{ github.run_id }}
          path: output/e2e/
          if-no-files-found: error
          retention-days: 14
