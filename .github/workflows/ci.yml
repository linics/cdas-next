name: verify

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  application-and-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cdas_next_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cdas_next_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      AI_PROVIDER_DISABLED: "1"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cdas_next_runtime
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/cdas_next_runtime
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cdas_next_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Apply migrations to empty PostgreSQL
        run: pnpm db:test:deploy

      - name: Verify database invariants
        run: pnpm db:test

      - name: Run database command tests
        run: pnpm test:db

      - name: Verify schema and applied migrations are in sync
        run: pnpm db:test:diff

      - name: Lint, type-check, unit-test, and build
        run: pnpm check
