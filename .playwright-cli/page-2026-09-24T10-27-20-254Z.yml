                      - text: 服务目标：目标 1、目标 2行动：收集、整理并解释用水数据。情境：比较不同时间或点位的数据。支架：提供数据整理模板。需提交：PDF / DOC / DOCX 文档：数据表与分析说明评价要点：数据完整，解释有依据。
