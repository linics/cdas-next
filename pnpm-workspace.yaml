allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@clerk/backend@3.16.7'
  - '@clerk/nextjs@7.7.7'
  - '@clerk/react@6.14.4'
  - '@clerk/shared@4.29.2'
overrides:
  deepmerge-ts: 8.0.1
  # Prisma 7.x 仍锁 mysql2 3.15.3 与旧 fast-uri；本项目只用 PostgreSQL，
  # 在同一大版本内抬到已修复版本以通过 audit:prod。
  fast-uri@3: ^3.1.6
  mysql2@3: ^3.24.4
