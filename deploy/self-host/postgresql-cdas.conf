# Drop-in for a 2GB VPS that only runs CDAS Next + PostgreSQL.
# Install as /etc/postgresql/*/main/conf.d/cdas.conf then reload.

shared_buffers = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 768MB
max_connections = 40
wal_buffers = 8MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
huge_pages = off
