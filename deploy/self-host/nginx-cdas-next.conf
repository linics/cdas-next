# CDAS Next reverse proxy for the China VPS.
# Install as /etc/nginx/sites-available/cdas-next
# Requires deploy/self-host/nginx-cdas-next-map.conf in conf.d.
#
# Reality on Tencent SA3 without ICP备案:
# - Bare http://IP reaches nginx for local-account access.
# - Domain names without ICP are redirected to dnspod webblock.
# - Inbound TLS on :443/:8443 is often terminated before nginx (ClientHello dropped).
# So the default public entry is HTTP on the IP. When you have an ICP-filed
# domain + working Let's Encrypt, switch to nginx-cdas-next-tls.conf.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 122.51.77.121 _;

    # Product contract allows 20 MiB per file; leave multipart overhead room.
    client_max_body_size 22m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location /_next/static/ {
        proxy_pass http://cdas_next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        proxy_pass http://cdas_next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
