# Bootstrap HTTP-only site used until Let's Encrypt certs exist.
# Install as /etc/nginx/sites-available/cdas-next (temporarily).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name cdas.122.51.77.121.sslip.io 122.51.77.121 _;

    client_max_body_size 8m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location /_next/static/ {
        proxy_pass http://cdas_next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        proxy_pass http://cdas_next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
