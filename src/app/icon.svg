<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- CDAS 标志的浏览器标签页图标（D-082）。favicon 读不到页面的 CSS 变量，
       这里写的是当前 --primary（渐变两端）与 --primary-foreground 的 sRGB 值；
       换配色时同步改。应用内的标志见 src/app/_components/brand-mark.tsx。 -->
  <defs>
    <linearGradient id="tile" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#4b959d" />
      <stop offset="1" stop-color="#00616a" />
    </linearGradient>
    <mask id="core" maskUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="white" />
      <circle cx="16" cy="16.7" r="3.3" fill="black" />
    </mask>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#tile)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="8.5" stroke="white" stroke-opacity="0.28" />
  <g fill="#f3fcfd">
    <g mask="url(#core)" stroke="#f3fcfd" stroke-opacity="0.75" stroke-width="0.9">
      <circle cx="16" cy="11.2" r="6.2" fill-opacity="0.3" />
      <circle cx="11.1" cy="19.5" r="6.2" fill-opacity="0.3" />
      <circle cx="20.9" cy="19.5" r="6.2" fill-opacity="0.3" />
    </g>
    <path d="M16 12.9C16.4 15.7 17 16.3 19.8 16.7 17 17.1 16.4 17.7 16 20.5 15.6 17.7 15 17.1 12.2 16.7 15 16.3 15.6 15.7 16 12.9Z" />
  </g>
</svg>
