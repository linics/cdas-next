<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- CDAS 标志的浏览器标签页图标（D-082）。favicon 读不到页面的 CSS 变量，
       这里的两色是当前 --primary / --primary-foreground 的 sRGB 值；
       换配色时同步改这两个值。应用内的标志见 _components/brand-mark.tsx。 -->
  <rect width="32" height="32" rx="9" fill="#007883" />
  <g fill="#f3fcfd">
    <circle cx="16" cy="11.6" r="6.4" opacity="0.5" />
    <circle cx="11.6" cy="19.2" r="6.4" opacity="0.5" />
    <circle cx="20.4" cy="19.2" r="6.4" opacity="0.5" />
    <circle cx="16" cy="16.7" r="1.9" />
  </g>
</svg>
